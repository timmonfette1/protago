version: v2
modules:
  - path: proto
    name: buf.build/timmonfette1/protago
  - path: internal/testdata
lint:
  use:
    - BASIC
    - FILE_LOWER_SNAKE_CASE
  except:
    - FIELD_NOT_REQUIRED
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - internal/testdata/testing.proto
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
