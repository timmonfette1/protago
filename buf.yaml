version: v2
modules:
  - path: protos
  - path: internal/testdata
lint:
  use:
    - BASIC
    - FILE_LOWER_SNAKE_CASE
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
