[tools]
go = "1.26.4"
buf = "1.71.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = { version = "1.36.11" }

[tasks.buf]
description = "Build all of the proto files"
run = [
    "buf generate --template protos/buf.gen.yaml"
]

[tasks.build]
description = "Build the repository"
run = [
    "go fmt ./...",
    "go build ./...",
    "go vet -composites=false ./..."
]

[tasks.test]
description = "Run unit tests"
run = "go test ./..."