edition = "2024";

package protago.bson.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/timmonfette1/protago/internal/genproto/protago/bson/v1;bson";

message BsonFieldOptions {
    string field_name = 1;
    bool omitempty = 2;
    bool minsize = 3;
    bool truncate = 4;
    bool inline = 5;
}

extend google.protobuf.FieldOptions {
    BsonFieldOptions options = 80000080;
}
